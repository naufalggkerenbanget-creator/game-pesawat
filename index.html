<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini Pesawat Arcade</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#07152f; font-family:system-ui,Arial,sans-serif; color:#fff; }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; width:min(100vw, 57.15vh); height:min(100vh, 175vw); aspect-ratio:4/7; background:#081c46; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #tip { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:12px; color:#d6eaff; text-shadow:0 1px 3px #000; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="700" aria-label="Game pesawat arcade"></canvas>
  <div id="tip">Geser jari untuk bergerak • Pesawat menembak otomatis</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const rand = (a,b) => Math.random()*(b-a)+a;
  let player, bullets, enemies, enemyShots, particles, score, lives, spawn, shoot, frame, gameOver, paused;
  let pointerDown = false;
  const keys = {};
  function reset() {
    player = {x:W/2, y:H-100, w:34, h:46, inv:0};
    bullets=[]; enemies=[]; enemyShots=[]; particles=[];
    score=0; lives=3; spawn=0; shoot=0; frame=0; gameOver=false; paused=false;
  }
  reset();

  function movePointer(e) {
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
    player.x=Math.max(22,Math.min(W-22,x));
    player.y=Math.max(35,Math.min(H-65,y));
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if(gameOver){reset();return;}
    pointerDown=true; canvas.setPointerCapture?.(e.pointerId); movePointer(e);
  });
  canvas.addEventListener('pointermove', e => { if(pointerDown && !gameOver){e.preventDefault();movePointer(e);} });
  canvas.addEventListener('pointerup', () => pointerDown=false);
  canvas.addEventListener('pointercancel', () => pointerDown=false);
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()]=true;
    if(e.key===' ' && gameOver) reset();
    if(e.key.toLowerCase()==='p' && !gameOver) paused=!paused;
  });
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()]=false);

  function hit(a,b) { return Math.abs(a.x-b.x)<(a.w+b.w)/2 && Math.abs(a.y-b.y)<(a.h+b.h)/2; }
  function burst(x,y) {
    for(let i=0;i<12;i++) particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:rand(12,25)});
  }
  function drawPlane(x,y,enemy=false) {
    ctx.save(); ctx.translate(x,y);
    if(enemy) ctx.rotate(Math.PI);
    ctx.fillStyle=enemy?'#f34b55':'#269dff';
    ctx.beginPath(); ctx.moveTo(0,-25); ctx.lineTo(-22,17); ctx.lineTo(-7,12); ctx.lineTo(0,20); ctx.lineTo(7,12); ctx.lineTo(22,17); ctx.closePath(); ctx.fill();
    ctx.fillStyle=enemy?'#ffda61':'#f4fbff';
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(-5,11); ctx.lineTo(0,7); ctx.lineTo(5,11); ctx.closePath(); ctx.fill();
    ctx.fillStyle=enemy?'#ffe3a0':'#5cf4ff';
    ctx.fillRect(-3,-9,6,13);
    ctx.restore();
  }
  function background() {
    ctx.fillStyle='#071b42'; ctx.fillRect(0,0,W,H);
    // garis laut bergerak
    ctx.strokeStyle='rgba(67,145,205,.17)'; ctx.lineWidth=1;
    for(let y=-35+(frame*1.5)%55;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    for(let i=0;i<22;i++){
      const x=(i*73+Math.sin(i*8)*30+W)%W;
      const y=(i*119+frame*2.2)%H;
      ctx.fillStyle='rgba(110,190,235,.25)';ctx.fillRect(x,y,2,7);
    }
    // pulau dekoratif
    for(const p of [{x:35,y:230},{x:355,y:470}]){
      ctx.fillStyle='#263f5b';ctx.beginPath();ctx.ellipse(p.x,p.y,23,13,0.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#486e68';ctx.beginPath();ctx.arc(p.x-4,p.y-3,7,0,Math.PI*2);ctx.fill();
    }
  }
  function update() {
    frame++;
    if(gameOver||paused)return;
    if(keys.arrowleft||keys.a)player.x-=4;
    if(keys.arrowright||keys.d)player.x+=4;
    if(keys.arrowup||keys.w)player.y-=4;
    if(keys.arrowdown||keys.s)player.y+=4;
    player.x=Math.max(22,Math.min(W-22,player.x));
    player.y=Math.max(35,Math.min(H-65,player.y));
    if(player.inv>0)player.inv--;

    shoot++;
    if(shoot>11){bullets.push({x:player.x,y:player.y-25,w:6,h:17});shoot=0;}
    bullets.forEach(b=>b.y-=9);
    bullets=bullets.filter(b=>b.y>-20);

    spawn++;
    if(spawn>Math.max(22,48-Math.floor(score/5))){
      enemies.push({x:rand(25,W-25),y:-30,w:30,h:38,speed:rand(1.8,2.8)+Math.min(score/35,3),fire:rand(45,110)});
      spawn=0;
    }
    for(const e of enemies){
      e.y+=e.speed;e.fire--;
      if(e.fire<=0){enemyShots.push({x:e.x,y:e.y+18,w:7,h:13});e.fire=rand(75,140);}
    }
    enemies=enemies.filter(e=>{if(e.y>H+30){lives--;return false;}return true;});
    enemyShots.forEach(b=>b.y+=4);
    enemyShots=enemyShots.filter(b=>b.y<H+15);

    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      let struck=false;
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(Math.abs(b.x-e.x)<18&&Math.abs(b.y-e.y)<22){
          bullets.splice(j,1);struck=true;break;
        }
      }
      if(struck){burst(e.x,e.y);enemies.splice(i,1);score++;continue;}
      if(player.inv===0&&hit(player,e)){burst(e.x,e.y);enemies.splice(i,1);lives--;player.inv=60;}
    }
    for(let i=enemyShots.length-1;i>=0;i--){
      if(player.inv===0&&hit(player,enemyShots[i])){enemyShots.splice(i,1);lives--;player.inv=60;burst(player.x,player.y);}
    }
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
    particles=particles.filter(p=>p.life>0);
    if(lives<=0)gameOver=true;
  }
  function draw() {
    background();
    for(const b of bullets){ctx.fillStyle='#63f6ff';ctx.shadowColor='#26eaff';ctx.shadowBlur=10;ctx.fillRect(b.x-3,b.y-9,6,17);ctx.shadowBlur=0;}
    for(const b of enemyShots){ctx.fillStyle='#ff9a42';ctx.shadowColor='#ff4b30';ctx.shadowBlur=8;ctx.fillRect(b.x-3,b.y-6,6,13);ctx.shadowBlur=0;}
    enemies.forEach(e=>drawPlane(e.x,e.y,true));
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/25);ctx.fillStyle='#ffd15c';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
    if(!gameOver && (player.inv===0||Math.floor(player.inv/5)%2===0))drawPlane(player.x,player.y);
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.fillText('SKOR '+String(score).padStart(5,'0'),14,31);
    ctx.fillStyle='#83eaff';ctx.font='bold 16px system-ui';ctx.fillText('NYAWA: '+'♥ '.repeat(Math.max(0,lives)),14,55);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='12px system-ui';ctx.fillText('P = jeda (keyboard)',W-132,26);
    if(paused) panel('JEDA','Tekan P untuk lanjut');
    if(gameOver) panel('GAME OVER','Skor: '+score+' • Sentuh layar untuk ulang');
  }
  function panel(title,sub) {
    ctx.fillStyle='rgba(0,8,24,.78)';ctx.fillRect(20,H/2-65,W-40,130);
    ctx.strokeStyle='#58dfff';ctx.lineWidth=2;ctx.strokeRect(20,H/2-65,W-40,130);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 29px system-ui';ctx.fillText(title,W/2,H/2-15);
    ctx.fillStyle='#bfeeff';ctx.font='15px system-ui';ctx.fillText(sub,W/2,H/2+23);ctx.textAlign='left';
  }
  function loop(){update();draw();requestAnimationFrame(loop);}
  loop();
})();
</script>
</body>
</html>
